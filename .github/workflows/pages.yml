name: Lanternas CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lanternas-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validar arquivos do site
        run: |
          test -s app/index.html
          test -s app/tropa.html
          test -s app/styles.css
          test -s app/conteudo.js
          test -s app/site.js
          node --check app/conteudo.js
          node --check app/site.js
      - name: Preparar arquivos do Pages
        run: |
          mkdir -p _site/docs
          cp -R app _site/app
          cp docs/Tropas_dos_Lanternas_DC.md _site/docs/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="pt-BR">
          <meta charset="utf-8">
          <title>Tropas dos Lanternas</title>
          <meta http-equiv="refresh" content="0; url=app/">
          <a href="app/">Abrir Tropas dos Lanternas</a>
          </html>
          HTML
      - name: Enviar artefato do Pages
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
